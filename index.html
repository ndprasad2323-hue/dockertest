<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #ff7043; color: white; padding: 15px; text-align: center; }
    nav { background: #333; padding: 10px; }
    nav a { color: white; margin: 0 15px; text-decoration: none; }
    .menu { display: flex; flex-wrap: wrap; padding: 20px; }
    .item { border: 1px solid #ddd; margin: 10px; padding: 15px; width: 200px; text-align: center; }
    .item img { width: 100%; height: auto; }
    footer { background: #333; color: white; text-align: center; padding: 15px; margin-top: 20px; }
    form { margin: 20px; }
    input, textarea { width: 100%; padding: 10px; margin: 5px 0; }
    button { background: #ff7043; color: white; padding: 10px; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>🍔 My Food App</h1>
    <p>Delicious meals at your fingertips</p>
  </header>

  <nav>
    <a href="#menu">Menu</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="menu" class="menu">
    <div class="item">
      <img src="https://via.placeholder.com/200" alt="Pizza">
      <h3>Pizza</h3>
      <p>Cheesy and delicious</p>
      <p>₹299</p>
    </div>
    <div class="item">
      <img src="https://via.placeholder.com/200" alt="Burger">
      <h3>Burger</h3>
      <p>Juicy and filling</p>
      <p>₹199</p>
    </div>
    <div class="item">
      <img src="https://via.placeholder.com/200" alt="Pasta">
      <h3>Pasta</h3>
      <p>Rich and creamy</p>
      <p>₹249</p>
    </div>
  </section>

  <section id="contact">
    <h2>Contact Us</h2>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="4" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 My Food App. All rights reserved.</p>
  </footer>

</body>
</html>
